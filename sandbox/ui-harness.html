<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ST DevTools v0.16.7 UI Sandbox</title>
    <link rel="stylesheet" href="../style.css?v=0.16.7">
    <style>
        body {
            --SmartThemeBodyColor: #172033;
            --SmartThemeQuoteColor: #1d4ed8;
            padding: 2rem;
            background: #eef2f7;
            color: #172033;
            font-family: system-ui, sans-serif;
        }

        body.sandbox-retro-theme {
            --SmartThemeUnderlineColor: #1b1c1e;
            --SmartThemeEmColor: #1b1c1e;
            --SmartThemeBorderColor: #1b1c1e;
            --sandbox-retro-button-fill: #fff;
        }

        body.sandbox-retro-theme :where(.menu_button) {
            border-radius: 0 !important;
            background-color: var(--sandbox-retro-button-fill);
            box-shadow: 2px 2px 0 var(--SmartThemeBorderColor);
            filter: none !important;
        }

        body.sandbox-retro-theme :where(.menu_button:hover) {
            background-color: rgb(27 28 30 / 10%) !important;
        }

        body.sandbox-retro-theme :where(select, input, textarea) {
            margin: 4px 0 !important;
            border: 1px solid var(--SmartThemeBorderColor) !important;
            border-radius: 0;
            background-color: var(--sandbox-retro-button-fill) !important;
            box-shadow: 2px 2px 0 var(--SmartThemeBorderColor);
            filter: none !important;
        }

        body.sandbox-retro-theme :where(input[type='checkbox']) {
            appearance: none;
            display: grid;
            inline-size: 1.1rem;
            block-size: 1.1rem;
            place-content: center;
        }

        body.sandbox-retro-theme :where(input[type='checkbox'])::before {
            display: block;
            inline-size: 0.72rem;
            block-size: 0.72rem;
            content: '';
            box-shadow: inset 1em 1em var(--SmartThemeEmColor);
            transform: scale(0);
        }

        body.sandbox-retro-theme :where(input[type='checkbox']:checked)::before {
            transform: scale(1);
        }

        body.sandbox-retro-theme :where(
            .fa,
            .fa-brands,
            .fa-regular,
            .fa-solid,
            .fab,
            .far,
            .fas
        ) {
            color: var(--SmartThemeUnderlineColor);
        }

        body.sandbox-retro-theme :where(details > summary) {
            justify-content: flex-end;
            text-align: right;
        }

        @media (max-width: 430px) {
            body.sandbox-retro-theme button.menu_button {
                flex: 1 1 100% !important;
                width: 100% !important;
                min-width: 100% !important;
                max-width: 100% !important;
            }
        }

        #sandbox-retro-theme-toggle {
            position: fixed;
            z-index: 39999;
            right: 0.75rem;
            bottom: 0.75rem;
            flex: none !important;
            width: auto !important;
            min-width: 0 !important;
            max-width: none !important;
            margin: 0 !important;
            padding: 0.45rem 0.7rem;
            border: 1px solid #475569 !important;
            border-radius: 6px !important;
            background: #fff !important;
            color: #172033 !important;
            box-shadow: 0 2px 8px rgb(15 23 42 / 24%) !important;
            font: 600 0.8rem/1.2 system-ui, sans-serif;
            writing-mode: horizontal-tb !important;
        }
    </style>
</head>
<body class="sandbox-retro-theme">
    <button
        id="sandbox-retro-theme-toggle"
        type="button"
        aria-pressed="true"
    >레트로 테마 충돌: 켜짐</button>
    <button id="sandbox-launcher" type="button">ST DevTools 샌드박스 열기</button>
    <button id="sandbox-onboarding" type="button">초보자 둘러보기</button>
    <button id="sandbox-storage-error" type="button">저장 실패 시뮬레이션</button>
    <button id="sandbox-capture-timeout" type="button">토큰 계산 멈춤 캡처 검사</button>
    <button id="sandbox-storage-mode" type="button">임시 저장 모드 전환</button>
    <button id="sandbox-summary-mode" type="button">기존 데이터 요약 시뮬레이션</button>
    <button id="sandbox-theme" type="button">밝음·어두움 테마 전환</button>
    <button id="sandbox-import-valid" type="button">정상 진단 가져오기</button>
    <button id="sandbox-import-invalid" type="button">위험 진단 거부 확인</button>
    <button id="sandbox-semantic-success" type="button">AI 검사 성공 fixture</button>
    <button id="sandbox-semantic-error" type="button">AI 요청 한도 오류 fixture</button>
    <button id="sandbox-semantic-slow" type="button">AI 검사 취소 fixture</button>
    <button id="sandbox-growth-focused" type="button">미세 토큰 성장 fixture</button>
    <p>
        v0.16.7의 실제 AI 의미 검사 코어와 결정적 가짜 어댑터로 미리보기·동의·
        엄격한 응답 검증·오류·취소 상태를 재현합니다. 실제 제공자·네트워크 호출은 없습니다.
    </p>
    <script type="module" src="./ui-harness.js?v=0.16.7"></script>
</body>
</html>
